<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل بيانات العمود - الفني</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-4">
    <div class="container" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>لوحة الفني: تعديل العمود ({{ pole.pole_ID }})</h4>
            <a href="{{ url_for('technician_logout', pole_id=pole.pole_ID) }}" class="btn btn-outline-danger btn-sm">خروج الفني</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card shadow mb-4">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="action" value="update_pole_data">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">ارتفاع العمود</label>
                            <input type="text" name="Pole_Height" class="form-control" value="{{ pole.Pole_Height }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">نوع الفانوس</label>
                            <input type="text" name="Fixture_Type" class="form-control" value="{{ pole.Fixture_Type }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">نوع المصباح</label>
                            <input type="text" name="Lamp_Type" class="form-control" value="{{ pole.Lamp_Type }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">حالة العمود</label>
                            <input type="text" name="Pole_Status" class="form-control" value="{{ pole.Pole_Status }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">حالة المصباح</label>
                            <input type="text" name="Lamp_Status" class="form-control" value="{{ pole.Lamp_Status }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">الباب (Door)</label>
                            <input type="text" name="Door" class="form-control" value="{{ pole.Door }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">المغذي (Feeder)</label>
                            <input type="text" name="Feeder" class="form-control" value="{{ pole.Feeder }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">قاعدة اللوحة (Panel Base)</label>
                            <input type="text" name="Panel_Base" class="form-control" value="{{ pole.Panel_Base }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">العمق (Depth)</label>
                            <input type="text" name="Depth" class="form-control" value="{{ pole.Depth }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">مقاس الفلانشة (Flange Size)</label>
                            <input type="text" name="Flange_Size" class="form-control" value="{{ pole.Flange_Size }}">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">ملاحظات الصيانة الفنية</label>
                            <textarea name="technician_notes" class="form-control" rows="3">{{ pole.technician_notes }}</textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">حفظ التحديثات</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
